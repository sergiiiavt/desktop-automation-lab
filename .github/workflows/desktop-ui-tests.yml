name: Desktop UI tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-tests:
    name: Notepad UI tests + screenshots + Allure
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      DESKTOP_TEST_ENVIRONMENT: github-hosted-windows-latest
      DESKTOP_TEST_ARTIFACTS_DIR: ${{ github.workspace }}\test-artifacts
      NPM_CONFIG_CACHE: ${{ runner.temp }}\npm-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Setup Node for Allure
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Cache npm downloads for Allure
        uses: actions/cache@v5
        with:
          path: ${{ env.NPM_CONFIG_CACHE }}
          key: npm-allure-${{ runner.os }}-3.16.0

      - name: Environment report
        shell: pwsh
        run: |
          "Runner: GitHub-hosted windows-latest" | Out-File desktop-environment.txt
          "Computer: $env:COMPUTERNAME" | Add-Content desktop-environment.txt
          "OS: $([System.Environment]::OSVersion.VersionString)" | Add-Content desktop-environment.txt
          "Architecture: $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)" | Add-Content desktop-environment.txt
          "User: $env:USERNAME" | Add-Content desktop-environment.txt
          "dotnet: $(dotnet --version)" | Add-Content desktop-environment.txt
          "python: $(python --version)" | Add-Content desktop-environment.txt

          $notepad = Get-Item "$env:WINDIR\System32\notepad.exe" -ErrorAction SilentlyContinue
          if ($notepad) {
            "Notepad path: $($notepad.FullName)" | Add-Content desktop-environment.txt
            "Notepad version: $($notepad.VersionInfo.FileVersion)" | Add-Content desktop-environment.txt
          }

          Get-Content desktop-environment.txt

      - name: Prepare result directories
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force test-artifacts, allure-results, allure-report, flaui/TestResults -ErrorAction SilentlyContinue
          Remove-Item pywinauto-pytest.xml -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path allure-results | Out-Null

      - name: Run ALL FlaUI tests
        shell: pwsh
        run: >-
          dotnet test flaui/Notepad.Tests/Notepad.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=flaui.trx"
          --results-directory flaui/TestResults

      - name: Install Python dependencies
        if: always()
        shell: pwsh
        run: python -m pip install -r python/requirements.txt

      - name: Run ALL pywinauto tests
        if: always()
        shell: pwsh
        run: >-
          python -m pytest python/tests -vv
          --junitxml=pywinauto-pytest.xml
          --alluredir=allure-results

      - name: Show collected Allure results
        if: always()
        shell: pwsh
        run: |
          $results = @(Get-ChildItem allure-results -Filter "*-result.json" -File -ErrorAction SilentlyContinue)
          Write-Host "Allure test result files in shared directory: $($results.Count)"
          if ($results.Count -eq 0) {
            throw "No Allure test result files were produced."
          }
          Get-ChildItem allure-results -File | Select-Object Name, Length

      - name: Generate Allure report
        if: always()
        shell: pwsh
        run: npx --prefer-offline -y allure@3.16.0 generate allure-results --config ./allurerc.mjs

      - name: Publish latest Allure report to Hetzner
        if: always() && github.event_name != 'pull_request'
        shell: pwsh
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_HOST: ${{ vars.HETZNER_HOST || '46.224.218.150' }}
          HETZNER_SSH_USER: ${{ vars.HETZNER_SSH_USER || 'root' }}
          HETZNER_SSH_PORT: ${{ vars.HETZNER_SSH_PORT || '22' }}
          HETZNER_WEB_PORT: ${{ vars.HETZNER_WEB_PORT || '8089' }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "allure-report/index.html")) {
            throw "No generated Allure report found."
          }
          if ([string]::IsNullOrWhiteSpace($env:HETZNER_SSH_KEY)) {
            throw "GitHub secret HETZNER_SSH_KEY is not configured."
          }

          $hostName = $env:HETZNER_HOST
          $sshUser = $env:HETZNER_SSH_USER
          $sshPort = [int]$env:HETZNER_SSH_PORT
          $webPort = [int]$env:HETZNER_WEB_PORT
          $releaseId = "${{ github.run_id }}-${{ github.run_attempt }}"
          $sshDir = Join-Path $HOME ".ssh"
          $keyPath = Join-Path $sshDir "desktop-automation-hetzner"
          $knownHosts = Join-Path $sshDir "known_hosts"
          $archive = "desktop-automation-allure.tgz"

          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          New-Item -ItemType File -Force -Path $knownHosts | Out-Null

          $keyText = $env:HETZNER_SSH_KEY.Trim().Replace('\n', "`n").Replace("`r", "")
          if (-not $keyText.StartsWith("-----BEGIN OPENSSH PRIVATE KEY-----") -or
              -not $keyText.EndsWith("-----END OPENSSH PRIVATE KEY-----")) {
            throw "HETZNER_SSH_KEY is not a complete OpenSSH private key."
          }

          [System.IO.File]::WriteAllText(
            $keyPath,
            $keyText + "`n",
            [System.Text.UTF8Encoding]::new($false)
          )
          icacls $keyPath /inheritance:r | Out-Null
          icacls $keyPath /grant:r "$($env:USERNAME):(R)" | Out-Null

          & ssh-keygen -y -f $keyPath | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "HETZNER_SSH_KEY is not a readable OpenSSH private key."
          }

          tar -czf $archive -C allure-report .
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create Allure report archive."
          }

          $sshOptions = @(
            "-i", $keyPath,
            "-o", "UserKnownHostsFile=$knownHosts",
            "-o", "StrictHostKeyChecking=accept-new"
          )

          & scp -P $sshPort @sshOptions $archive scripts/hetzner/deploy-allure.sh "$sshUser@$hostName`:/tmp/"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload the Allure release to Hetzner."
          }

          & ssh -p $sshPort @sshOptions "$sshUser@$hostName" "bash /tmp/deploy-allure.sh '$releaseId' '$webPort' && rm -f /tmp/deploy-allure.sh"
          if ($LASTEXITCODE -ne 0) {
            throw "Hetzner Allure deployment failed."
          }

          Remove-Item $keyPath, $archive -Force -ErrorAction SilentlyContinue
          Write-Host "Allure report published to http://$hostName`:$webPort"

      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-ui-test-report
          path: |
            allure-report
            allure-results
            test-artifacts
            desktop-environment.txt
            flaui/TestResults
            pywinauto-pytest.xml
          if-no-files-found: warn
          retention-days: 7
