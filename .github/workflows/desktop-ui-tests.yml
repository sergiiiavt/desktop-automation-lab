name: Desktop UI baseline - GitHub hosted

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flaui:
    name: FlaUI baseline / NUnit
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      DESKTOP_TEST_ENVIRONMENT: github-hosted-windows
      DESKTOP_TEST_ARTIFACTS_DIR: ${{ github.workspace }}\flaui\TestArtifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Capture runner environment
        shell: pwsh
        run: |
          "Runner: GitHub-hosted" | Out-File flaui-environment.txt
          "OS: $([System.Environment]::OSVersion.VersionString)" | Add-Content flaui-environment.txt
          "PowerShell: $($PSVersionTable.PSVersion)" | Add-Content flaui-environment.txt
          "dotnet: $(dotnet --version)" | Add-Content flaui-environment.txt
          $notepad = Get-Item "$env:WINDIR\System32\notepad.exe" -ErrorAction SilentlyContinue
          if ($notepad) {
            "Notepad path: $($notepad.FullName)" | Add-Content flaui-environment.txt
            "Notepad version: $($notepad.VersionInfo.FileVersion)" | Add-Content flaui-environment.txt
          }
          Get-Content flaui-environment.txt

      - name: Run FlaUI baseline tests only
        shell: pwsh
        run: >-
          dotnet test flaui/Notepad.Tests/Notepad.Tests.csproj
          --configuration Release
          --filter "TestCategory=Baseline"
          --logger "trx;LogFileName=flaui.trx"
          --results-directory flaui/TestResults

      - name: Upload FlaUI Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-flaui
          path: allure-results/flaui
          if-no-files-found: warn

      - name: Upload FlaUI debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaui-debug-artifacts
          path: |
            flaui/TestResults
            flaui/TestArtifacts
            flaui-environment.txt
          if-no-files-found: ignore

  pywinauto:
    name: pywinauto baseline / pytest
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      DESKTOP_TEST_ENVIRONMENT: github-hosted-windows
      DESKTOP_TEST_ARTIFACTS_DIR: ${{ github.workspace }}\python\TestArtifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r python/requirements.txt

      - name: Run pywinauto baseline test
        shell: pwsh
        run: >-
          python -m pytest python/tests -vv
          --junitxml=pywinauto-pytest.xml
          --alluredir=allure-results/python
          --clean-alluredir

      - name: Upload pywinauto Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-pywinauto
          path: allure-results/python
          if-no-files-found: warn

      - name: Upload pywinauto debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pywinauto-debug-artifacts
          path: |
            pywinauto-pytest.xml
            python/TestArtifacts
          if-no-files-found: ignore

  allure-report:
    name: Build Allure report
    runs-on: ubuntu-latest
    needs: [flaui, pywinauto]
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Generate Allure 3 report
        shell: bash
        run: npx -y allure@3.16.0 generate allure-results --config ./allurerc.mjs

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: error
