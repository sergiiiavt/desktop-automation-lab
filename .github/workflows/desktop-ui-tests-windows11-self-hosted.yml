name: Desktop UI tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop-tests:
    name: Notepad UI tests + screenshots + Allure
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      DESKTOP_TEST_ENVIRONMENT: github-hosted-windows-latest
      DESKTOP_TEST_ARTIFACTS_DIR: ${{ github.workspace }}\test-artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Setup Node for Allure
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Environment report
        shell: pwsh
        run: |
          "Runner: GitHub-hosted windows-latest" | Out-File desktop-environment.txt
          "Computer: $env:COMPUTERNAME" | Add-Content desktop-environment.txt
          "OS: $([System.Environment]::OSVersion.VersionString)" | Add-Content desktop-environment.txt
          "Architecture: $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)" | Add-Content desktop-environment.txt
          "User: $env:USERNAME" | Add-Content desktop-environment.txt
          "dotnet: $(dotnet --version)" | Add-Content desktop-environment.txt
          "python: $(python --version)" | Add-Content desktop-environment.txt

          $notepad = Get-Item "$env:WINDIR\System32\notepad.exe" -ErrorAction SilentlyContinue
          if ($notepad) {
            "Notepad path: $($notepad.FullName)" | Add-Content desktop-environment.txt
            "Notepad version: $($notepad.VersionInfo.FileVersion)" | Add-Content desktop-environment.txt
          }

          Get-Content desktop-environment.txt

      - name: Prepare result directories
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force test-artifacts, allure-results, allure-report, flaui/TestResults -ErrorAction SilentlyContinue
          Remove-Item pywinauto-pytest.xml -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path allure-results | Out-Null

      - name: Run ALL FlaUI tests
        shell: pwsh
        run: >-
          dotnet test flaui/Notepad.Tests/Notepad.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=flaui.trx"
          --results-directory flaui/TestResults

      - name: Install Python dependencies
        if: always()
        shell: pwsh
        run: python -m pip install -r python/requirements.txt

      - name: Run ALL pywinauto tests
        if: always()
        shell: pwsh
        run: >-
          python -m pytest python/tests -vv
          --junitxml=pywinauto-pytest.xml
          --alluredir=allure-results

      - name: Show collected Allure results
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem allure-results -File | Select-Object Name, Length
          $results = @(Get-ChildItem allure-results -Filter "*-result.json" -File)
          Write-Host "Allure test result files in shared directory: $($results.Count)"
          if ($results.Count -ne 5) {
            Write-Warning "Expected 5 Allure test results (4 FlaUI + 1 pywinauto), found $($results.Count)."
          }

      - name: Generate Allure report
        if: always()
        shell: pwsh
        run: npx -y allure@3.16.0 generate allure-results --config ./allurerc.mjs

      - name: Publish latest Allure report to Hetzner
        if: always() && github.event_name != 'pull_request'
        shell: pwsh
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          if (-not (Test-Path "allure-report/index.html")) {
            Write-Warning "No generated Allure report found; skipping Hetzner publish."
            exit 0
          }

          if ([string]::IsNullOrWhiteSpace($env:HETZNER_SSH_KEY)) {
            Write-Warning "GitHub secret HETZNER_SSH_KEY is not configured; skipping Hetzner publish."
            exit 0
          }

          $hostName = "46.224.218.150"
          $sshUser = "root"
          $sshPort = 22
          $webPort = 8089
          $sshDir = Join-Path $HOME ".ssh"
          $keyPath = Join-Path $sshDir "desktop-automation-hetzner"
          $knownHosts = Join-Path $sshDir "known_hosts"

          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          Set-Content -Path $keyPath -Value $env:HETZNER_SSH_KEY -NoNewline
          icacls $keyPath /inheritance:r | Out-Null
          icacls $keyPath /grant:r "$($env:USERNAME):(R)" | Out-Null

          ssh-keyscan -p $sshPort $hostName | Out-File -FilePath $knownHosts -Encoding ascii

          tar -czf allure-report.tgz -C allure-report .
          scp -P $sshPort -i $keyPath -o "UserKnownHostsFile=$knownHosts" -o StrictHostKeyChecking=yes `
            allure-report.tgz "$sshUser@$hostName`:/tmp/desktop-automation-allure.tgz"

          $remoteSetup = @'
          set -eu

          SITE=/opt/desktop-automation-allure/site
          SERVICE=/etc/systemd/system/desktop-automation-allure.service

          mkdir -p "$SITE"
          rm -rf "$SITE"/*
          tar -xzf /tmp/desktop-automation-allure.tgz -C "$SITE"
          rm -f /tmp/desktop-automation-allure.tgz

          if ! command -v python3 >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y python3
          fi

          cat > "$SERVICE" <<'EOF'
          [Unit]
          Description=Desktop Automation Allure Report
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/python3 -m http.server 8089 --bind 0.0.0.0 --directory /opt/desktop-automation-allure/site
          Restart=always
          RestartSec=2

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable desktop-automation-allure.service >/dev/null
          systemctl restart desktop-automation-allure.service
          systemctl --no-pager --full status desktop-automation-allure.service | head -n 20
          '@

          $remoteSetup | ssh -p $sshPort -i $keyPath -o "UserKnownHostsFile=$knownHosts" -o StrictHostKeyChecking=yes `
            "$sshUser@$hostName" "bash -s"

          Remove-Item $keyPath, allure-report.tgz -Force -ErrorAction SilentlyContinue
          Write-Host "Allure report published to http://$hostName`:$webPort"

      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-test-report
          path: |
            allure-report
            allure-results
            test-artifacts
            desktop-environment.txt
            flaui/TestResults
            pywinauto-pytest.xml
          if-no-files-found: warn
          retention-days: 7
